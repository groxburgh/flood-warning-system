name: monitor

on:
  schedule:
    # Every 30 minutes, offset from the top of the hour. GitHub may delay or
    # skip scheduled runs under load; the status page shows the real check time.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths: ["monitor/**", ".github/workflows/monitor.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6

      - name: Check out history (data branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" data >/dev/null; then
            git clone --quiet --depth 1 --branch data "$url" store
          else
            mkdir store && git -C store init --quiet -b data && git -C store remote add origin "$url"
          fi

      # After the end date (monitor/config.py END_AT) the first run writes an
      # ARCHIVED marker; every later run stops here and does nothing.
      - name: Stop if monitoring has ended
        id: gate
        run: |
          if [ -f store/ARCHIVED ]; then
            echo "Monitoring has ended: $(cat store/ARCHIVED)"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.deploy == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.deploy == 'true'
        run: pip install -r requirements.txt

      - name: Run monitor
        if: steps.gate.outputs.deploy == 'true'
        run: |
          code=0
          python -m monitor.run --store store --site site || code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::Could not read DHM's page; recorded on the status page."
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi

      - name: Save history
        if: steps.gate.outputs.deploy == 'true'
        run: |
          cd store
          git config user.name "gauge-watch-bot"
          git config user.email "gauge-watch-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "check $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git push --quiet origin data

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.deploy == 'true'
        with:
          path: site

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
